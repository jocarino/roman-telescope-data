server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compress everything text-ish: the planet index alone is ~2.8 MB raw, ~0.5 MB gzipped.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types application/json application/javascript text/css image/svg+xml;

    # Clean URLs: /planet/hd-189733-b -> /planet/hd-189733-b.html
    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    # Build-stamped filenames (planets.index.<id>.json, glossary.terms.<id>.js) never change
    # content under the same name — safe to cache for a year.
    location ~ "^/(planets\.index|glossary\.terms)\.\d+\.(json|js)$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Long-cache immutable static assets (vendored libs, css, js).
    location /static/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # .ase palette downloads.
    location /palettes/ {
        types { } default_type application/octet-stream;
        add_header Content-Disposition "attachment";
    }

    # Unknown URL -> the cockpit page (web/templates/404.html), with a real 404 status.
    error_page 404 /404.html;
    location = /404.html { internal; }
}
