server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compress everything text-ish: the planet index alone is ~2.8 MB raw, ~0.5 MB gzipped.
    # gzip_proxied defaults to "off", which means nginx SKIPS compression for any request
    # carrying a Via header — i.e. one that arrived through a reverse proxy. In production we
    # sit behind Dokploy's Traefik, so leaving the default risks silently serving the whole
    # site uncompressed the moment the front proxy starts announcing itself. "any" compresses
    # regardless of who forwarded the request.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    # text/html is always compressed and must NOT be listed (nginx warns on the duplicate).
    gzip_types application/json application/javascript text/css image/svg+xml text/plain;

    # Clean URLs: /planet/hd-189733-b -> /planet/hd-189733-b.html
    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    # Build-stamped filenames (planets.index.<id>.json, glossary.terms.<id>.js,
    # sky-field[-c].<id>.svg) never change content under the same name — safe to cache for a
    # year. The sky field matters most here: every planet page references the same one, so it
    # is fetched once for the whole site and then served from cache on every later page.
    location ~ "^/(planets\.(index|extra)|glossary\.terms|sky-field(-c)?)\.\d+\.(json|js|svg)$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Long-cache immutable static assets (vendored libs, css, js).
    location /static/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # .ase palette downloads.
    location /palettes/ {
        types { } default_type application/octet-stream;
        add_header Content-Disposition "attachment";
    }

    # Unknown URL -> the cockpit page (web/templates/404.html), with a real 404 status.
    error_page 404 /404.html;
    location = /404.html { internal; }
}
