# ── access logging ────────────────────────────────────────────────────────────────────
# This file is included from nginx's http{} block, so maps and log formats belong here,
# above the server.
#
# Why bother: PostHog is JavaScript, and the audience this project most wants to measure —
# crawlers, and the assistants that quote us — never runs JavaScript. A request line is the
# ONLY evidence that GPTBot fetched /llms.txt or that something pulled /api/. The default
# nginx log goes to container stdout, which Docker discards when the container is replaced,
# i.e. on every deploy. See the volume note in the Dockerfile.

# Behind Dokploy's Traefik every request arrives from the proxy, so $remote_addr is a
# container-network address, identical for all traffic and useless. The client is the first
# entry of X-Forwarded-For (later entries are proxies, and the whole header is client-
# supplied — fine for "how many distinct crawlers", never trust it for anything gated).
map $http_x_forwarded_for $client_addr {
    ""                          $remote_addr;
    "~^\s*(?<xff_first>[^,\s]+)" $xff_first;
    default                     $remote_addr;
}

# ...then keep only the network part: IPv4 /24, IPv6 /64. These logs exist to answer "was
# this a bot and what did it fetch", never "who was this", and a truncated address still
# groups one noisy crawler into one line-item. Anything unparseable logs as "-".
map $client_addr $client_net {
    "~^(?<v4>\d+\.\d+\.\d+)\."          "${v4}.0";
    "~*^(?<v6>([0-9a-f]+:){4})"         "${v6}:";
    default                             "-";
}

# The user-agent is the payload here: it is what separates Googlebot from GPTBot from a
# person. $request_time is cheap and catches a pathological page before anyone reports it.
log_format site '$time_iso8601 $client_net "$request" $status $body_bytes_sent '
                '"$http_referer" "$http_user_agent" $request_time';

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Two sinks on purpose: the file is durable when /var/log/site is a mounted volume,
    # and stdout keeps `docker logs` / the Dokploy log pane working as before.
    access_log /var/log/site/access.log site;
    access_log /dev/stdout site;

    # Compress everything text-ish: the planet index alone is ~2.8 MB raw, ~0.5 MB gzipped.
    # gzip_proxied defaults to "off", which means nginx SKIPS compression for any request
    # carrying a Via header — i.e. one that arrived through a reverse proxy. Measured
    # 2026-08-05 against Traefik v3.3 terminating TLS in front of this exact config: Traefik
    # forwards X-Forwarded-Proto/For but NO Via, so the default would still compress today.
    # "any" is insurance, and it is cheap: with the default, one added Via header is enough
    # to send a 1.3 MB response out raw (measured), and Traefik does not compress on our
    # behalf when nginx declines to — the uncompressed body went straight through it.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    # text/html is always compressed and must NOT be listed (nginx warns on the duplicate).
    gzip_types application/json application/javascript text/css image/svg+xml text/plain;

    # Clean URLs: /planet/hd-189733-b -> /planet/hd-189733-b.html
    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    # Build-stamped filenames (planets.index.<id>.json, glossary.terms.<id>.js,
    # sky-field[-c].<id>.svg) never change content under the same name — safe to cache for a
    # year. The sky field matters most here: every planet page references the same one, so it
    # is fetched once for the whole site and then served from cache on every later page.
    location ~ "^/(planets\.(index|extra)|glossary\.terms|sky-field(-c)?)\.\d+\.(json|js|svg)$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Static assets (vendored libs, css, js, fonts, photos). ONE Cache-Control header, set
    # directly: `expires 7d` plus `add_header Cache-Control "public"` sent the header twice
    # ("max-age=604800" and "public" as separate lines) — valid, but duplicated Cache-Control
    # is exactly the kind of thing an intermediary gets wrong. Not `immutable`: css/js are
    # busted with ?v=<build_id> and update regardless, but the fonts and the photos under
    # obs/ are referenced by plain name and do occasionally get replaced.
    location /static/ {
        add_header Cache-Control "public, max-age=2592000";
    }

    # Open Graph share cards. Content-addressed by planet id and regenerated on every
    # deploy, so a long cache is safe — and the clients fetching them (Slack, X, iMessage,
    # Google) all cache aggressively themselves and re-fetch on their own schedule.
    location /og/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # Crawler files. Short cache so a sitemap regenerated by a deploy is picked up the same
    # day rather than a week later.
    location = /sitemap.xml { expires 1h; add_header Cache-Control "public"; }
    location = /robots.txt  { expires 1h; add_header Cache-Control "public"; }

    # .ase palette downloads.
    location /palettes/ {
        types { } default_type application/octet-stream;
        add_header Content-Disposition "attachment";
    }

    # Unknown URL -> the cockpit page (web/templates/404.html), with a real 404 status.
    error_page 404 /404.html;
    location = /404.html { internal; }
}
