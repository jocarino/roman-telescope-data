name: Newswatch

# Twice a day, ask whether an exoplanet is in the news — and if one is, push a briefing to
# Telegram. Nothing is published, nothing is committed, nothing is opened: the only output is
# a message on a phone, because the decision to post is the part that must stay human.
#
# PRIVACY, and it is the reason for half the choices below. This repository is PUBLIC, so
# every workflow log is world-readable. The briefing carries where-to-post tactics and
# half-written copy, which is exactly what should not be. So the job runs `poll --quiet`
# (one line per item: tier, score, feed, planet) and the substance goes to the chat and
# nowhere else. Do not "helpfully" drop --quiet to debug a run; use workflow_dispatch with
# dry_run and read the message you get instead.
#
# No `uv sync` anywhere here: newswatch and scripts/fetch_data.py are stdlib-only, so the job
# is bare python3 and takes seconds. That is worth preserving.
#
# NOTE: GitHub disables scheduled workflows after 60 days with no repository activity, and
# emails the owner when it does. Re-enabling is manual.

on:
  schedule:
    # 07:00 and 17:00 UTC = 08:00 and 18:00 Lisbon in summer. The morning run catches arXiv
    # (announced 20:00 ET Sun–Thu, feed regenerated at midnight ET) plus overnight US press;
    # the evening run catches the European press day, which is when ESO/ESA release. Actions
    # cron drifts by 5–15 min under load — nothing here depends on the exact minute.
    - cron: "0 7 * * *"
    - cron: "0 17 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Poll and alert, but don't advance the seen/suppression state"
        type: boolean
        default: false
      max_age_days:
        description: "Ignore items older than this many days"
        type: string
        default: "7"

permissions:
  contents: read

concurrency:
  group: newswatch
  cancel-in-progress: false

jobs:
  watch:
    name: Anything in the news?
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Restore newswatch state (seen ids + 30-day suppression + alias table)
        id: state
        # Rolling key: cache entries are immutable, so each run saves under its own key and
        # restores from the newest prefix match. Losing it is survivable rather than silent —
        # the 7-day recency gate bounds a re-alert to at most a week of stories, and the run
        # says so below.
        uses: actions/cache/restore@v4
        with:
          path: data/cache
          key: newswatch-state-${{ github.run_id }}
          restore-keys: newswatch-state-

      - name: Cache the catalogue (86 MB; only re-downloads when data/RELEASE moves)
        id: planets
        uses: actions/cache@v4
        with:
          path: data/planets.json
          key: planets-${{ hashFiles('data/RELEASE') }}

      - name: Fetch the catalogue
        # A no-op when the cache hit. Public repo, so no token needed.
        run: python3 scripts/fetch_data.py

      - name: Refresh the alias table (weekly, not twice a day)
        # One TAP pull of ~6,300 rows. The Archive rate-limits and new planets appear on
        # Thursdays, so twice-daily rebuilds would be rude and pointless.
        run: python3 tools/newswatch.py aliases --if-older-than 7

      - name: Say whether the state survived
        run: |
          if [ "${{ steps.state.outputs.cache-matched-key }}" = "" ]; then
            echo "::warning::No cached state — seen ids and 30-day suppression start empty."
            echo "Items from the last few days may re-alert once. This self-corrects."
          fi

      - name: Poll and alert
        env:
          NEWSWATCH_TELEGRAM_TOKEN: ${{ secrets.NEWSWATCH_TELEGRAM_TOKEN }}
          NEWSWATCH_TELEGRAM_CHAT_ID: ${{ secrets.NEWSWATCH_TELEGRAM_CHAT_ID }}
          SITE_BASE_URL: ${{ vars.SITE_BASE_URL }}
        run: |
          python3 tools/newswatch.py poll \
            --notify --quiet \
            --max-age-days "${{ inputs.max_age_days || '7' }}" \
            --log data/cache/newsjack-log.md \
            ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Save newswatch state
        # Always: a run that alerted and then failed to save would alert again next time.
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/cache
          key: newswatch-state-${{ github.run_id }}

      - name: Tell me if the watcher itself broke
        # Without this, a broken run is indistinguishable from a quiet news day — and the
        # quiet day is the common case, so you would never notice. curl, not the tool: if the
        # tool is what broke, it cannot be trusted to report its own failure. `|| true` so a
        # notification failure cannot mask the real one.
        if: failure()
        env:
          TOKEN: ${{ secrets.NEWSWATCH_TELEGRAM_TOKEN }}
          CHAT: ${{ secrets.NEWSWATCH_TELEGRAM_CHAT_ID }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -sS -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT}" \
            --data-urlencode "text=🟠 newswatch FAILED — you are not being told about the news right now. ${RUN}" \
            -o /dev/null || true
