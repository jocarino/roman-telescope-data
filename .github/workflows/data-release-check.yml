name: Data release check

# Does `data/RELEASE` name a release the deploy can actually fetch?
#
# The deploy pins its data: `scripts/fetch_data.py` downloads the asset from the release named
# in `data/RELEASE`, with no token, because the repo is public. That pin is deliberate — tracking
# "latest" would let publishing a release change production with no review, and would silently
# build against stale data whenever the newest release was still a draft. But the pin has one
# failure mode, and on 2026-08-07 it happened: the catalogue-refresh PR was merged while its
# release was still a DRAFT. Draft assets 404 for a tokenless client, so every deploy failed —
# and nothing said so, because the live site keeps serving the last good build.
#
# This check moves that discovery from "the next deploy" to "this pull request". It runs on
# every PR rather than only when `data/RELEASE` changes: the file can be perfectly untouched and
# still be wrong, if the release it names is later unpublished or deleted.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: data-release-check-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetchable:
    name: data/RELEASE names a fetchable release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/checkout@v4

      - name: Verify automatic data PR
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_REF: ${{ github.ref_name }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          python3 scripts/check_data_pr.py "$PR_REF" "$HEAD_SHA"

      # A check run made here lands in this workflow_dispatch check suite, which GitHub never
      # attaches to the PR, so rulesets ignore it (#71 sat BLOCKED with a green check). A commit
      # status belongs to the SHA, not a suite, and still carries the GitHub Actions app identity.
      - name: Start required data check
        id: required
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
            -f context='data/RELEASE names a fetchable release' -f state=pending \
            -f target_url="$RUN_URL" >/dev/null
          echo "started=true" >> "$GITHUB_OUTPUT"

      - name: Is the pinned release published and downloadable?
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail

          if [ ! -s data/RELEASE ]; then
            echo "reason=data/RELEASE is missing or empty" >> "$GITHUB_OUTPUT"
            echo "::error::data/RELEASE is missing or empty — the deploy has no tag to fetch."
            exit 1
          fi

          tag="$(tr -d '[:space:]' < data/RELEASE)"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Pinned release: ${tag}"

          draft="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || echo missing)"
          if [ "$draft" = "missing" ]; then
            echo "reason=no release tagged ${tag} exists" >> "$GITHUB_OUTPUT"
            echo "::error::data/RELEASE names ${tag}, but no such release exists."
            exit 1
          fi
          if [ "$draft" = "true" ]; then
            echo "reason=${tag} is still a DRAFT" >> "$GITHUB_OUTPUT"
            echo "::error::${tag} is still a draft. Publish it (gh release edit ${tag} --draft=false) before merging, or the deploy will 404."
            exit 1
          fi

          # The decisive test, and the only one that reproduces what Dokploy actually does:
          # an unauthenticated request for the asset. `gh` above speaks with a token and would
          # happily describe a release the deploy cannot reach. HEAD is enough — GitHub answers
          # 200 for a published asset and 404 otherwise, so this costs no bandwidth.
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/planets.json"
          code="$(curl -sIL -o /dev/null -w '%{http_code}' --max-time 60 "$url" || echo 000)"
          echo "Tokenless HEAD ${url} -> ${code}"
          if [ "$code" != "200" ]; then
            echo "reason=planets.json is not downloadable from ${tag} (HTTP ${code})" >> "$GITHUB_OUTPUT"
            echo "::error::planets.json is not fetchable from ${tag} without a token (HTTP ${code})."
            exit 1
          fi

          echo "OK: ${tag} is published and planets.json is fetchable without a token."

      - name: Test the published catalogue
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          uv sync --frozen
          uv run python scripts/fetch_data.py
          uv run pytest -q

      - name: Complete required data check
        if: always() && github.event_name == 'workflow_dispatch' && steps.required.outputs.started == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.sha }}
          OUTCOME: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          case "$OUTCOME" in success) state=success ;; failure) state=failure ;; *) state=error ;; esac
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
            -f context='data/RELEASE names a fetchable release' -f state="$state" \
            -f target_url="$RUN_URL" >/dev/null

      # Only ever fires on failure. This repository's notification discipline (see the newswatch
      # section of the README) is that a quiet run sends nothing at all — a periodic "still fine"
      # message is one you can do nothing with, and those are what train a person to stop reading
      # the ones they can. The sender uses only the standard library and validates API acceptance.
      - name: Tell Telegram
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          REASON: ${{ steps.check.outputs.reason }}
          TAG: ${{ steps.check.outputs.tag }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_NUM: ${{ github.event.pull_request.number || 'data update' }}
          PR_TITLE: ${{ github.event.pull_request.title || 'Automated catalogue validation' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -u
          text="$(printf '%s\n' \
            "🔴 <b>Do not merge #${PR_NUM}</b>" \
            "" \
            "$(printf '%s' "${PR_TITLE}" | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g')" \
            "" \
            "<b>Catalogue validation failed:</b> ${REASON:-check or tests failed}" \
            "" \
            "Automatic merge is blocked. Inspect the failed check or tests before retrying." \
            "" \
            "${PR_URL}" \
            "${RUN_URL}")"
          printf '%s' "$text" | python3 scripts/send_telegram.py

  merge:
    name: Merge tested catalogue data
    needs: fetchable
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Merge the tested data PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR_REF: ${{ github.ref_name }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          url=$(python3 scripts/check_data_pr.py "$PR_REF" "$HEAD_SHA")
          gh pr merge "$url" --merge --match-head-commit "$HEAD_SHA"

      - name: Alert on merge failure
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          printf '%s\n' \
            '🔴 <b>Catalogue automatic merge failed</b>' \
            '' \
            'The catalogue checks passed, but GitHub refused the merge. Inspect this run; the next probe will retry.' \
            '' \
            "$RUN_URL" | python3 scripts/send_telegram.py
