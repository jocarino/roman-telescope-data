<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Exoplanet Palette{% endblock %}</title>
  <meta name="description" content="The colour scheme of every known exoplanet, derived from physics.">
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <script>try{document.documentElement.setAttribute("data-accent",localStorage.getItem("accent")||"tron");}catch(e){}</script>
  <link rel="stylesheet" href="/static/style.css?v={{ build_id }}">
  <style>[x-cloak]{display:none !important}</style>
  <script src="/static/planet-render.js?v={{ build_id }}"></script>
  <script src="/static/vendor/alpine.min.js" defer></script>
  <script src="/static/app.js?v={{ build_id }}"></script>
  {# Jargon: the definitions (one cached file, built from data/glossary.json) and the shared
     hover popover. Deferred and fully delegated — marked terms injected later still work. #}
  <script src="/glossary.terms.{{ build_id }}.js" defer></script>
  <script src="/static/glossary.js?v={{ build_id }}" defer></script>
</head>
<body>
  <div class="wrap">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
